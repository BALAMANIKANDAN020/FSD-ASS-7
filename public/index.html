<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Banking Application</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #333; }
        .balance-container { text-align: center; margin: 20px 0; font-size: 24px; color: #28a745; }
        .form-group { margin-bottom: 15px; }
        input[type="number"] { width: calc(100% - 22px); padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .message { text-align: center; margin-top: 15px; color: #d9534f; }
        .success { color: #5cb85c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Banking Dashboard</h1>
        <h2 id="ownerName">Welcome</h2>
        <div class="balance-container">
            Balance: $<span id="balanceAmount">0.00</span>
        </div>
        
        <div class="form-group">
            <input type="number" id="amount" placeholder="Enter amount" min="1">
        </div>
        
        <div class="form-group">
            <button onclick="deposit()">Deposit</button>
        </div>
        <div class="form-group">
            <button onclick="withdraw()" style="background-color: #f0ad4e;">Withdraw</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        async function fetchAccount() {
            const res = await fetch('/api/account');
            const data = await res.json();
            document.getElementById('ownerName').innerText = `Welcome, ${data.owner}`;
            document.getElementById('balanceAmount').innerText = data.balance.toFixed(2);
        }

        async function performTransaction(type) {
            const amountInput = document.getElementById('amount');
            const amount = parseFloat(amountInput.value);
            const messageEl = document.getElementById('message');

            if (!amount || amount <= 0) {
                messageEl.innerText = 'Please enter a valid amount';
                messageEl.className = 'message';
                return;
            }

            const res = await fetch(`/api/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount })
            });

            const data = await res.json();
            if (res.ok) {
                messageEl.innerText = data.message;
                messageEl.className = 'message success';
                document.getElementById('balanceAmount').innerText = data.balance.toFixed(2);
                amountInput.value = '';
            } else {
                messageEl.innerText = data.message;
                messageEl.className = 'message';
            }
        }

        function deposit() { performTransaction('deposit'); }
        function withdraw() { performTransaction('withdraw'); }

        // Initial load
        fetchAccount();
    </script>
</body>
</html>
